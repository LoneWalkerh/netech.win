<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lone</title>
<link rel="icon" href="kewl.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07070a;
    --panel:#111116;
    --panel-2:#16161d;
    --line:#232329;
    --cyan:#4ce0ff;
    --violet:#8b5cf6;
    --text:#eceef1;
    --text-dim:#8a8d96;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
    position:relative;
    overflow-x:hidden;
  }

  /* two ambient glow circles, like the reference */
  .glow{
    position:fixed;
    width:70vw;
    height:70vw;
    max-width:900px;
    max-height:900px;
    border-radius:50%;
    filter:blur(120px);
    pointer-events:none;
    z-index:0;
  }
  .glow.a{
    top:-25%;
    left:-20%;
    background:radial-gradient(circle, #6fc4ff 0%, transparent 70%);
    opacity:0.6;
  }
  .glow.b{
    bottom:-25%;
    right:-20%;
    background:radial-gradient(circle, #0c1c33 0%, transparent 70%);
    opacity:0.9;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015) 40%, rgba(14,14,18,0.7));
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:24px;
    padding:36px 32px 28px;
    text-align:center;
    box-shadow:
      0 40px 100px -40px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 0 40px rgba(255,255,255,0.015);
    overflow:hidden;
    opacity:0;
    animation:in 0.6s ease forwards;
  }

  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:60%;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
    pointer-events:none;
    z-index:-1;
  }

  .card::after{
    content:"";
    position:absolute;
    top:-40%;
    left:-20%;
    width:70%;
    height:70%;
    background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    transform:rotate(-15deg);
    pointer-events:none;
    z-index:-1;
  }

  @keyframes in{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; }
  }

  .pfp{
    width:84px; height:84px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--line);
    margin-bottom:14px;
  }

  h1{
    font-size:1.5em;
    font-weight:700;
  }

  .sub{
    font-size:0.88em;
    color:var(--text-dim);
    margin-top:2px;
  }

  .typed{
    font-family:'JetBrains Mono', monospace;
    font-size:0.82em;
    color:var(--cyan);
    margin-top:8px;
    height:1.3em;
    display:inline-block;
    border-right:2px solid var(--cyan);
    white-space:nowrap;
    overflow:hidden;
  }

  .badges{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:16px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:0.72em;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text);
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
    padding:6px 12px;
    border-radius:999px;
    text-transform:uppercase;
  }

  .badge.accent{
    border-color:rgba(76,224,255,0.4);
    color:var(--cyan);
  }

  .divider{
    height:1px;
    background:var(--line);
    margin:22px 0 18px;
  }

  .bio{
    font-size:0.92em;
    color:var(--text-dim);
    line-height:1.7;
  }

  .bio .heart{ color:#ff6b6b; }
  .bio .highlight{ color:var(--text); }

  .notice{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    font-size:0.82em;
    color:var(--text-dim);
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
    border-radius:14px;
    padding:10px 16px;
    margin-top:18px;
  }

  .notice svg{
    width:15px; height:15px;
    flex:none;
    color:var(--text-dim);
  }

  .notice a{
    color:#5b9dff;
    text-decoration:none;
    font-weight:600;
  }

  .notice a:hover{ text-decoration:underline; }

  .socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:22px 0 6px;
  }

  .socials a{
    width:40px; height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
    color:var(--text);
    transition:border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }

  .socials a:hover{
    border-color:var(--cyan);
    color:var(--cyan);
    background:rgba(76,224,255,0.12);
    transform:translateY(-2px);
  }

  .socials svg{ width:18px; height:18px; }

  .tabs{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:26px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size:0.68em;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--cyan);
    position:relative;
    padding-bottom:10px;
  }

  .tab::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-11px;
    height:2px;
    background:linear-gradient(90deg, var(--violet), var(--cyan));
    border-radius:2px;
  }

  .games{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-top:18px;
  }

  .game{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .game img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
    transition:border-color 0.2s ease;
  }

  .game img:hover{ border-color:var(--cyan); }

  .game span{
    margin-top:6px;
    font-size:0.65em;
    color:var(--text-dim);
  }

  .footer{
    margin-top:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68em;
    color:var(--text-dim);
    letter-spacing:0.03em;
  }
</style>
</head>

  <script>
    function calculateDaysToBirthday(month, day){
      const now = new Date();
      let year = now.getFullYear();
      let next = new Date(year, month - 1, day);
      if(next < now){ next = new Date(year + 1, month - 1, day); }
      return Math.ceil((next - now) / (1000 * 60 * 60 * 24));
    }

    window.onload = () => {
      const phrases = [
        "hi, I'm Lone 👋",
        "hru?",
        "wyd?",
        "wsp?",
        "i'm from nepal",
      ];
      const typedEl = document.getElementById("typed");
      let i = 0, char = 0, isDeleting = false, speed = 100;

      function type(){
        const current = phrases[i];
        char = isDeleting ? char - 1 : char + 1;
        typedEl.textContent = current.substring(0, char);

        if(!isDeleting && char === current.length){
          isDeleting = true;
          speed = 1200;
        } else if(isDeleting && char === 0){
          isDeleting = false;
          i = (i + 1) % phrases.length;
          speed = 200;
        } else {
          speed = isDeleting ? 50 : 100;
        }
        setTimeout(type, speed);
      }
      type();

      const birthdaySpan = document.getElementById('birthday');
      const days = calculateDaysToBirthday(3, 30);
      birthdaySpan.title = days === 0 ? "ITS MY BIRTHDAY!" : `${days} day${days > 1 ? 's' : ''} until my birthday`;
    };
  </script>
